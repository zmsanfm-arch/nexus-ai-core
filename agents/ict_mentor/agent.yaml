id: ict_mentor
name: ICT Mentor
version: 0.3.0
status: specification
integration:
  host: nexus_ai_core
  invocation: central_orchestrator_only
  owns_orchestrator: false
  owns_task_manager: false
  owns_execution_gateway: false
  direct_broker_connectivity: false
  direct_mt5_connectivity: false
  stores_broker_credentials: false
domain: ict_education_and_trade_analysis
language:
  primary: en
  response_languages: [fa, en]
market_context:
  initial_instrument: XAUUSD
  platform_context: MT5
  default_mode: advisory
modes:
  default: advisory
  supported:
    advisory:
      enabled: true
      description: Education, source lookup, chart analysis, strategy formalization, and trade review only.
    position_management:
      enabled: false
      activation: prohibited_in_current_release
    autonomous_execution:
      enabled: false
      activation: prohibited_in_current_release
capabilities:
  enabled:
    - ict.education
    - ict.source_lookup
    - ict.chart_analysis
    - ict.strategy_formalization
    - ict.trade_review
  defined_disabled:
    - ict.position_monitoring
    - ict.position_management
    - ict.autonomous_execution
permissions:
  requested:
    - knowledge.retrieve
    - user_input.read
    - chart_attachment.read
  not_granted:
    - market_data.live.read
    - account.read
    - positions.read
    - positions.modify
    - orders.submit
    - orders.cancel
    - broker.credentials.read
    - mt5.connect
    - risk_policy.modify
    - governance.bypass
security:
  execution_allowed: false
  direct_external_side_effects: false
  model_output_is_authorization: false
  central_risk_engine_authoritative: true
  central_execution_gateway_authoritative: true
  fail_closed_on_missing_or_ambiguous_context: true
knowledge:
  retrieval_required_for_ict_attribution: true
  citations_required: true
  source_policy: official_first
  user_rules_require_explicit_confirmation: true
