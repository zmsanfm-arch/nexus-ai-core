name: CI

on:
  push:
    branches: [main, "integration/**", "feature/**", "audit/**", "ops/**", "perf/**", "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      NEXUS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nexus_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Install encrypted-backup drill utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client
      - name: Run end-to-end encrypted PostgreSQL backup and restore drill
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          source_db="nexus_backup_ci"
          restore_db="nexus_restore_ci"
          source_url="postgresql://postgres:postgres@localhost:5432/${source_db}"
          restore_url="postgresql://postgres:postgres@localhost:5432/${restore_db}"
          createdb --host localhost --username postgres "${source_db}"
          createdb --host localhost --username postgres "${restore_db}"
          psql "${source_url}" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE restore_drill_check (id integer PRIMARY KEY, marker text NOT NULL);
          INSERT INTO restore_drill_check (id, marker) VALUES (1, 'restore-ok');
          SQL
          identity_file="${RUNNER_TEMP}/nexus-age-identity.txt"
          backup_dir="${RUNNER_TEMP}/nexus-encrypted-backups"
          mkdir -p "${backup_dir}"
          age-keygen -o "${identity_file}"
          chmod 600 "${identity_file}"
          recipient="$(age-keygen -y "${identity_file}")"
          DATABASE_URL="${source_url}" AGE_RECIPIENT="${recipient}" BACKUP_DIR="${backup_dir}" \
            bash scripts/backup_postgres_encrypted.sh
          backup_file="$(find "${backup_dir}" -maxdepth 1 -type f -name '*.dump.age' -print -quit)"
          test -n "${backup_file}"
          BACKUP_FILE="${backup_file}" AGE_IDENTITY_FILE="${identity_file}" \
            NEXUS_RESTORE_DATABASE_URL="${restore_url}" \
            NEXUS_RESTORE_ALLOWED_DATABASE_URL="${restore_url}" \
            NEXUS_RESTORE_CONFIRM=YES bash scripts/restore_postgres_drill.sh
          restored="$(psql "${restore_url}" -v ON_ERROR_STOP=1 -Atc "SELECT marker FROM restore_drill_check WHERE id = 1")"
          test "${restored}" = "restore-ok"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag nexus-ai-core:ci .
      - name: Smoke-test container startup and health
        run: |
          set -eu
          docker run -d --name nexus-ai-core-smoke -p 127.0.0.1:8000:8000 nexus-ai-core:ci
          trap 'docker rm -f nexus-ai-core-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format='{{.State.Health.Status}}' nexus-ai-core-smoke)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs nexus-ai-core-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs nexus-ai-core-smoke
          exit 1
