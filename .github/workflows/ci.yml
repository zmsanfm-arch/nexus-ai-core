name: CI

on:
  push:
    branches: [main, "integration/**", "feature/**", "audit/**", "ops/**", "perf/**", "hardening/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      NEXUS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nexus_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Prepare local digest-pinned image for Docker sandbox integration test
        run: |
          set -euo pipefail
          docker pull busybox:1.36.1
          image="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' busybox:1.36.1 | head -n1)"
          case "$image" in
            *@sha256:*) ;;
            *) echo "Could not resolve a digest-pinned local BusyBox image" >&2; exit 1 ;;
          esac
          echo "NEXUS_TEST_DOCKER_BASE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Run tests including real offline Docker build
        run: pytest -q
      - name: Install encrypted-backup drill utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client
      - name: Run end-to-end encrypted PostgreSQL backup and restore drill
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          source_db="nexus_backup_ci"
          restore_db="nexus_restore_ci"
          source_url="postgresql://postgres:postgres@localhost:5432/${source_db}"
          restore_url="postgresql://postgres:postgres@localhost:5432/${restore_db}"
          createdb --host localhost --username postgres "${source_db}"
          createdb --host localhost --username postgres "${restore_db}"
          psql "${source_url}" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE restore_drill_check (id integer PRIMARY KEY, marker text NOT NULL);
          INSERT INTO restore_drill_check (id, marker) VALUES (1, 'restore-ok');
          SQL
          identity_file="${RUNNER_TEMP}/nexus-age-identity.txt"
          backup_dir="${RUNNER_TEMP}/nexus-encrypted-backups"
          mkdir -p "${backup_dir}"
          age-keygen -o "${identity_file}"
          chmod 600 "${identity_file}"
          recipient="$(age-keygen -y "${identity_file}")"
          pg16_bin="${RUNNER_TEMP}/postgres16-client"
          mkdir -p "${pg16_bin}"
          cat > "${pg16_bin}/pg_dump" <<'SH'
          #!/usr/bin/env bash
          exec docker run --rm --network host -e PGPASSWORD="${PGPASSWORD:-}" postgres:16 pg_dump "$@"
          SH
          cat > "${pg16_bin}/pg_restore" <<'SH'
          #!/usr/bin/env bash
          exec docker run --rm --network host -i -e PGPASSWORD="${PGPASSWORD:-}" postgres:16 pg_restore "$@"
          SH
          chmod 700 "${pg16_bin}/pg_dump" "${pg16_bin}/pg_restore"
          export PATH="${pg16_bin}:${PATH}"
          DATABASE_URL="${source_url}" AGE_RECIPIENT="${recipient}" BACKUP_DIR="${backup_dir}" \
            bash scripts/backup_postgres_encrypted.sh
          backup_file="$(find "${backup_dir}" -maxdepth 1 -type f -name '*.dump.age' -print -quit)"
          test -n "${backup_file}"
          BACKUP_FILE="${backup_file}" AGE_IDENTITY_FILE="${identity_file}" \
            NEXUS_RESTORE_DATABASE_URL="${restore_url}" \
            NEXUS_RESTORE_ALLOWED_DATABASE_URL="${restore_url}" \
            NEXUS_RESTORE_CONFIRM=YES bash scripts/restore_postgres_drill.sh
          restored="$(psql "${restore_url}" -v ON_ERROR_STOP=1 -Atc "SELECT marker FROM restore_drill_check WHERE id = 1")"
          test "${restored}" = "restore-ok"
      - name: Run encrypted mission artifact-volume backup and restore drill
        run: |
          set -euo pipefail
          identity_file="${RUNNER_TEMP}/nexus-artifacts-age-identity.txt"
          artifact_root="${RUNNER_TEMP}/nexus-artifact-source"
          backup_dir="${RUNNER_TEMP}/nexus-artifact-backups"
          mkdir -p "${artifact_root}" "${backup_dir}"
          age-keygen -o "${identity_file}"
          chmod 600 "${identity_file}"
          recipient="$(age-keygen -y "${identity_file}")"
          artifact_id="$(NEXUS_ARTIFACT_ROOT="${artifact_root}" python - <<'PY'
          import os
          from app.services.artifact_store import LocalArtifactStore
          store = LocalArtifactStore(os.environ["NEXUS_ARTIFACT_ROOT"])
          item = store.put(
              "ci-restore-principal",
              b"mission-artifact-restore-proof",
              mission_id="ci_restore",
              media_type="text/plain",
              metadata={"kind": "restore_drill"},
          )
          print(item["artifact_id"])
          PY
          )"
          backup_file="$(NEXUS_ARTIFACT_ROOT="${artifact_root}" AGE_RECIPIENT="${recipient}" BACKUP_DIR="${backup_dir}" bash scripts/backup_mission_artifacts_encrypted.sh)"
          test -f "${backup_file}"
          rm -rf "${artifact_root}"
          mkdir -p "${artifact_root}"
          BACKUP_FILE="${backup_file}" AGE_IDENTITY_FILE="${identity_file}" \
            NEXUS_RESTORE_ARTIFACT_ROOT="${artifact_root}" NEXUS_RESTORE_CONFIRM=YES \
            bash scripts/restore_mission_artifacts_drill.sh
          NEXUS_ARTIFACT_ROOT="${artifact_root}" RESTORED_ARTIFACT_ID="${artifact_id}" python - <<'PY'
          import os
          from app.services.artifact_store import LocalArtifactStore
          store = LocalArtifactStore(os.environ["NEXUS_ARTIFACT_ROOT"])
          metadata, content = store.get("ci-restore-principal", os.environ["RESTORED_ARTIFACT_ID"])
          assert content == b"mission-artifact-restore-proof"
          assert metadata["metadata"]["kind"] == "restore_drill"
          PY

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate production Compose model
        run: |
          set -euo pipefail
          cat > .env.production <<'ENV'
          POSTGRES_DB=nexus_ci
          POSTGRES_USER=nexus_ci
          POSTGRES_PASSWORD=ci-only-placeholder
          NEXUS_DOMAIN=example.com
          ENV
          docker compose -f docker-compose.production.yml config --quiet
          rm -f .env.production
      - name: Build container
        run: docker build --tag nexus-ai-core:ci .
      - name: Smoke-test container startup and health
        run: |
          set -eu
          docker run -d --name nexus-ai-core-smoke -p 127.0.0.1:8000:8000 nexus-ai-core:ci
          trap 'docker rm -f nexus-ai-core-smoke >/dev/null 2>&1 || true' EXIT
          docker exec nexus-ai-core-smoke python -c "from pathlib import Path; assert Path('/app/scripts/migrate_release.py').is_file(); assert Path('/app/docs/strategy-research/schemas/strategy.schema.json').is_file(); assert Path('/app/docs/strategy-research/schemas/experiment-plan.schema.json').is_file()"
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format='{{.State.Health.Status}}' nexus-ai-core-smoke)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs nexus-ai-core-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs nexus-ai-core-smoke
          exit 1
      - name: Build and exercise isolated Playwright and egress proxy containers
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          docker pull python:3.12-slim
          base_image="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' python:3.12-slim | grep -m1 '@sha256:')"
          test -n "$base_image"
          docker build --build-arg PYTHON_BASE_IMAGE="$base_image" -f Dockerfile.browser-egress -t nexus-browser-egress:ci .
          docker build --build-arg PYTHON_BASE_IMAGE="$base_image" -f Dockerfile.playwright-runner -t nexus-playwright-runner:ci .
          docker network create nexus-browser-egress
          docker run -d --name nexus-egress-proxy --network nexus-browser-egress \
            -e NEXUS_EGRESS_PROXY_MODE=allowlist-v1 \
            -e NEXUS_EGRESS_ALLOWED_DOMAINS=example.com \
            nexus-browser-egress:ci
          docker network connect nexus-browser-internal nexus-egress-proxy
          cleanup() {
            docker rm -f nexus-egress-proxy >/dev/null 2>&1 || true
            docker network rm nexus-browser-egress >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if docker logs nexus-egress-proxy 2>&1 | grep -q "egress proxy ready"; then
              break
            fi
            sleep 1
          done
          docker logs nexus-egress-proxy 2>&1 | grep -q "egress proxy ready"
          browser_image="$(docker image inspect --format '{{.Id}}' nexus-playwright-runner:ci)"
          NEXUS_TEST_PLAYWRIGHT_IMAGE="$browser_image" \
          NEXUS_TEST_BROWSER_NETWORK=nexus-browser-internal \
          NEXUS_TEST_BROWSER_PROXY_URL=http://nexus-egress-proxy:3128 \
          NEXUS_TEST_BROWSER_PROXY_CONTAINER=nexus-egress-proxy \
          NEXUS_TEST_BROWSER_ALLOWED_DOMAINS=example.com \
            pytest -q \
              tests/test_playwright_docker_runner.py::test_real_playwright_container_uses_egress_gateway \
              tests/test_web_studio_e2e.py::test_real_browser_mission_persists_principal_scoped_evidence

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies and security scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
      - name: Audit Python dependency vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Run Bandit static security analysis
        run: bandit -r app scripts -ll
