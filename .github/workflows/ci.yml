name: CI

on:
  push:
    branches: [main, "integration/**", "feature/**", "audit/**", "ops/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      NEXUS_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nexus_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag nexus-ai-core:ci .
      - name: Smoke-test container startup and health
        run: |
          set -eu
          docker run -d --name nexus-ai-core-smoke -p 127.0.0.1:8000:8000 nexus-ai-core:ci
          trap 'docker rm -f nexus-ai-core-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format='{{.State.Health.Status}}' nexus-ai-core-smoke)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs nexus-ai-core-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs nexus-ai-core-smoke
          exit 1
